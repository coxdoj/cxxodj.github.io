name: Review public boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  review-public-boundary:
    name: review-public-boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Third Floor public destinations
        run: |
          test -f third-floor-app/privacy.html
          test -f third-floor-app/support.html
          test -f third-floor-app/terms.html
          grep -q "Privacy Policy" third-floor-app/privacy.html
          grep -q "Email Third Floor Support" third-floor-app/support.html
          grep -q "Terms of Use" third-floor-app/terms.html
          ! grep -RqiE "placeholder|your-id|example\.com" third-floor-app
